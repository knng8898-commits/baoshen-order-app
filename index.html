<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=5.2.0">
  <style>
    .quick-actions{position:fixed;left:50%;bottom:0;z-index:900;transform:translateX(-50%);display:flex;gap:9px;width:min(900px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#ffffffee;border-top:1px solid var(--line);box-shadow:0 -4px 16px #00000014;backdrop-filter:blur(10px)}
    .quick-actions button{flex:1}.app{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  </style>
  <title>寶神叫貨助手 v4</title>
</head>
<body>
<main class="app">
  <header class="app-header">
    <div><h1 data-i18n="appTitle">📦 寶神叫貨助手</h1><p data-i18n="appSubtitle">v5｜點貨、叫貨、圖片與管理設定</p></div>
    <div class="header-actions"><button id="languageToggle" class="ghost" data-i18n="languageButton">Tiếng Việt</button><button id="installButton" class="ghost hidden" data-i18n="installApp">安裝 App</button></div>
  </header>

  <section class="card">
    <div class="section-title" data-i18n="dashboard">今日叫貨總覽</div>
    <div id="dashboard" class="dashboard"></div>
  </section>

  <section class="card">
    <div class="section-title" data-i18n="storeAndDate">門市與日期</div>
    <div class="segmented" id="storeButtons"></div>
    <div class="date-row">
      <label><span data-i18n="workDate">點貨日期</span><input type="date" id="workDate"></label>
      <label><span data-i18n="stockProfile">庫存建議</span><select id="stockProfile"><option value="auto" data-i18n="auto">自動判斷</option><option value="weekday" data-i18n="weekday">平日</option><option value="holiday" data-i18n="holiday">假日</option></select></label>
    </div>
    <div id="dateSummary" class="date-summary"></div>
  </section>

  <section class="card sticky-vendors">
    <div class="section-title" data-i18n="vendorSwitch">廠商快速切換</div>
    <div class="vendor-grid" id="vendorButtons"></div>
    <div id="vendorNotice"></div>
    <div id="stockAlert" class="hidden"></div>
  </section>

  <section class="card">
    <div class="mode-grid">
      <button id="orderMode" class="mode-button" data-i18n="orderMode">直接輸入叫貨量</button>
      <button id="inventoryMode" class="mode-button" data-i18n="inventoryMode">輸入目前庫存</button>
    </div>
    <div class="toolbar">
      <button id="generateText" class="primary" data-i18n="generateLine">產生 LINE 訊息</button>
      <button id="generateImage" data-i18n="generateImage">產生宏鑫訂貨圖片</button>
      <button id="clearCurrent" class="danger" data-i18n="clearVendor">清空本廠商</button>
    </div>
    <div id="items"></div>
  </section>

  <section class="card">
    <div class="section-title" data-i18n="linePreview">LINE 訊息預覽</div>
    <textarea id="messageOutput" data-i18n-placeholder="linePlaceholder" placeholder="按「產生 LINE 訊息」後顯示內容"></textarea>
    <div class="two-buttons"><button id="copyMessage" class="primary" data-i18n="copy">📋 複製內容</button><button id="saveHistory" data-i18n="saveHistory">💾 儲存紀錄</button></div>
  </section>

  <section class="card hidden" id="imageSection">
    <div class="section-title" data-i18n="imageSheet">宏鑫訂貨明細表</div>
    <canvas id="orderCanvas" width="1240" height="1754"></canvas>
    <div class="two-buttons"><button id="downloadImage" class="primary" data-i18n="downloadImage">儲存圖片</button><button id="shareImage" data-i18n="shareImage">分享圖片</button></div>
    <p class="helper" data-i18n="imageHelp">iPhone／Android 可先按「分享圖片」；若不支援，系統會自動下載圖片。</p>
  </section>

  <section class="card">
    <div class="history-header"><div class="section-title" data-i18n="recentHistory">最近叫貨紀錄</div><button id="clearHistory" data-i18n="clearHistory">清除紀錄</button></div>
    <div id="historyAnalytics"></div>
    <div id="history"></div>
  </section>

  <section class="card">
    <details>
      <summary data-i18n="admin">🔐 管理設定</summary>
      <p class="helper" data-i18n="adminHelp">預設密碼 8888。建議庫存與臨時休假只儲存在目前裝置，請定期匯出備份。</p>
      <div id="adminLogin" class="admin-row"><input id="adminPassword" type="password" data-i18n-placeholder="passwordPlaceholder" placeholder="輸入管理密碼"><button id="unlockAdmin" data-i18n="unlock">解鎖</button></div>
      <div id="adminPanel" class="hidden">
        <div class="toolbar"><button id="lockAdmin" data-i18n="logout">登出</button><button id="changePassword" data-i18n="changePassword">修改密碼</button><button id="exportData" data-i18n="exportSettings">匯出設定</button><button id="importData" data-i18n="importSettings">匯入設定</button><input type="file" id="importFile" accept="application/json" class="hidden"></div>
        <hr>
        <div class="section-title" data-i18n="suggestedManagement">建議庫存管理</div>
        <div class="date-row"><label><span data-i18n="store">門市</span><select id="adminStore"></select></label><label><span data-i18n="vendor">廠商</span><select id="adminVendor"></select></label></div>
        <div id="suggestedEditor"></div>
        <div class="two-buttons"><button id="saveSuggested" class="primary" data-i18n="saveSuggested">儲存建議庫存</button><button id="resetSuggested" data-i18n="resetDefault">恢復預設</button></div>
        <hr>
        <div class="section-title" data-i18n="vendorHolidays">各廠商臨時休假</div>
        <div class="date-row"><label><span data-i18n="vendor">廠商</span><select id="holidayVendor"></select></label><label><span data-i18n="holidayDate">休假日期</span><input id="holidayDate" type="date"></label></div>
        <button id="addHoliday" class="full-button" data-i18n="addHoliday">新增休假日期</button>
        <div id="holidayList"></div>
      </div>
    </details>
  </section>
</main>
<nav class="quick-actions" aria-label="快速操作">
  <button id="quickGenerateText" class="primary" data-i18n="quickLine">產生 LINE 文字</button>
  <button id="quickGenerateImage" data-i18n="quickImage">產生訂貨圖片</button>
</nav>
<div id="toast" class="toast"></div>
<script src="data.js?v=5.2.0"></script>
<script src="i18n.js?v=5.2.0"></script>
<script src="app.js?v=5.2.0"></script>
<script src="history-analytics.js?v=5.2.0"></script>
<script src="vendor-rules.js?v=5.2.0"></script>
</body>
</html>
